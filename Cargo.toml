[package]
name = "local-wisper"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "lw"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
baml_sdk = { path = "baml_sdk" }
clap = { version = "4.5", features = ["derive"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["api-28", "cuda", "download-binaries", "ndarray", "std"] }
parakeet-rs = { version = "=0.3.7", default-features = false, features = ["api-28", "cuda", "ort-defaults"] }

[profile.release]
lto = "thin"
strip = true
